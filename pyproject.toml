[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spdx-header-check"
version = "0.1.0"
description = "Strict REUSE-style source header check for prek, pre-commit, and GitHub Actions"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Albert M. W. Yau" }]

[project.scripts]
spdx-header-check = "spdx_headers:main"

[tool.setuptools]
py-modules = ["spdx_headers"]

[tool.ruff]
line-length = 88
target-version = "py311"
