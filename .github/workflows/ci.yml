name: CI
on:
  push:
  pull_request:

permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e . pre-commit
      - run: python -m unittest discover -s tests -v
      - run: spdx-header-check
      - run: pre-commit try-repo . spdx-header-check --all-files
      - uses: ./
